agent:
  step_limit: 120
  cost_limit: 0.0
model:
  model_name: "openai/Qwen/Qwen2.5-Coder-7B-Instruct"
  model_kwargs:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 4096
    api_base: "http://localhost:8000/v1"
    num_retries: 8
    timeout: 180
    extra_body:
      repetition_penalty: 1.1
environment:
  environment_class: docker
  cwd: "/testbed"
  timeout: 120
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
    BASH_ENV: /root/.bashrc
